name: Security audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 7 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Full-history secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      # gitleaks-action needs a paid license for organization repositories, so the
      # CLI is installed straight from its release asset and checked by SHA-256.
      - name: Install checksum-pinned gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Scan every commit and the current tree
        run: |
          gitleaks git --log-opts=--all --redact --no-banner .
          gitleaks dir --redact --no-banner .

  dependencies:
    name: Locked dependency audits
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.32"
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          package-manager-cache: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: "11.5.0"
          run_install: false
      - name: Audit the frozen Python and npm graphs
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          uv lock --check
          uv export --frozen --all-groups --no-emit-project --format requirements.txt --output-file /tmp/avow-audit-requirements.txt
          uvx --from pip-audit==2.10.1 pip-audit --requirement /tmp/avow-audit-requirements.txt --require-hashes --strict --disable-pip --progress-spinner off
          pnpm --dir ts install --frozen-lockfile --ignore-scripts
          pnpm --dir ts audit --audit-level high

  workflows:
    name: actionlint and zizmor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.32"
          enable-cache: false
      - name: Run actionlint at a fixed version
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Run zizmor at a fixed version
        run: uvx zizmor==1.29.0 --persona=auditor --min-severity=low --offline --strict-collection .github
